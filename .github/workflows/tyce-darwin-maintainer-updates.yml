name: Tyce Darwin maintainer updates
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: tyce-darwin-maintainer-updates
  cancel-in-progress: false
jobs:
  detect:
    name: Detect stable releases
    if: github.repository == 'TyceHerrman/nixpkgs'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.releases.outputs.base_sha }}
      has_updates: ${{ steps.releases.outputs.has_updates }}
      matrix: ${{ steps.releases.outputs.matrix }}
    steps:
      - name: Check out the fork-only detector
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: automation
          persist-credentials: false
          sparse-checkout: .github/maintainer-updates
      - name: Detect release candidates
        id: releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 automation/.github/maintainer-updates/check_releases.py \
            --manifest automation/.github/maintainer-updates/packages.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"
  update:
    name: Update ${{ matrix.attr }} to ${{ matrix.new_version }}
    needs: detect
    if: github.repository == 'TyceHerrman/nixpkgs' && needs.detect.outputs.has_updates == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write # Push the validated automation branch to this fork.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Check out the inspected upstream revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: NixOS/nixpkgs
          ref: ${{ needs.detect.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Configure the update commit identity
        run: |
          git config user.name "TyceHerrman nixpkgs updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run the package update script
        env:
          ATTR: ${{ matrix.attr }}
        run: |
          nix-shell -I nixpkgs=. maintainers/scripts/update.nix \
            --argstr package "$ATTR" \
            --arg commit true \
            --arg skip-prompt true
      - name: Validate the update commit and version
        env:
          ATTR: ${{ matrix.attr }}
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          NEW_VERSION: ${{ matrix.new_version }}
          PACKAGE_FILE: ${{ matrix.package_file }}
        run: |
          test "$(git rev-list --count "$BASE_SHA..HEAD")" = 1
          test -z "$(git status --porcelain)"
          changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
          test "$changed_files" = "$PACKAGE_FILE"
          python3 - "$PACKAGE_FILE" "$NEW_VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          package_file, expected = sys.argv[1:]
          source = Path(package_file).read_text()
          versions = re.findall(
              r'^\s*version\s*=\s*"([^"]+)"\s*;', source, re.MULTILINE
          )
          if versions != [expected]:
              raise SystemExit(
                  f"expected version {expected!r} in {package_file}, got {versions!r}"
              )
          PY
      - name: Build on Apple Silicon
        id: build
        env:
          ATTR: ${{ matrix.attr }}
        run: |
          out_path="$(nix-build --no-out-link -A "$ATTR")"
          test -n "$out_path"
          printf 'out_path=%s\n' "$out_path" >>"$GITHUB_OUTPUT"
      - name: Run package-specific verification
        env:
          ATTR: ${{ matrix.attr }}
          NEW_VERSION: ${{ matrix.new_version }}
          OUT_PATH: ${{ steps.build.outputs.out_path }}
          VERIFICATION: ${{ matrix.verification }}
        run: |
          case "$VERIFICATION" in
            harper-signature)
              test "$ATTR" = "harper-desktop"
              codesign --verify --deep --strict "$OUT_PATH/Applications/Harper.app"
              ;;
            whatcable-cli)
              test "$ATTR" = "whatcable"
              version_output="$("$OUT_PATH/bin/whatcable" --version)"
              case "$version_output" in
                *"$NEW_VERSION"*) ;;
                *)
                  printf 'WhatCable version mismatch: %s\n' "$version_output" >&2
                  exit 1
                  ;;
              esac
              "$OUT_PATH/bin/whatcable" --json | python3 -c \
                'import json,sys; value=json.load(sys.stdin); assert isinstance(value, (dict, list))'
              ;;
            *)
              printf 'Unsupported verification: %s\n' "$VERIFICATION" >&2
              exit 1
              ;;
          esac
      - name: Push the validated automation branch
        env:
          BRANCH: ${{ matrix.branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          existing_pr_count="$(gh api --method GET \
            repos/NixOS/nixpkgs/pulls \
            -f state=open \
            -f "head=TyceHerrman:$BRANCH" \
            --jq length)"
          test "$existing_pr_count" = 0
          authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
            push --force https://github.com/TyceHerrman/nixpkgs.git \
            "HEAD:refs/heads/$BRANCH"
      - name: Open a draft pull request under Tyce Herrman's account
        env:
          ATTR: ${{ matrix.attr }}
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          BRANCH: ${{ matrix.branch }}
          GH_TOKEN: ${{ secrets.NIXPKGS_PR_TOKEN }}
          NEW_VERSION: ${{ matrix.new_version }}
          OLD_VERSION: ${{ matrix.old_version }}
          RELEASE_URL: ${{ matrix.release_url }}
          TITLE: ${{ matrix.title }}
          VERIFICATION: ${{ matrix.verification }}
        run: |
          if test -z "$GH_TOKEN"; then
            echo "NIXPKGS_PR_TOKEN is not configured" >&2
            exit 1
          fi
          body="$(printf '%s\n' \
            "## Package update" \
            "" \
            "- Version: \`$OLD_VERSION\` -> \`$NEW_VERSION\`" \
            "- Upstream release: $RELEASE_URL" \
            "- Nixpkgs base: \`$BASE_SHA\`" \
            "" \
            "## Verification" \
            "" \
            "- Update: \`nix-shell -I nixpkgs=. maintainers/scripts/update.nix --argstr package $ATTR --arg commit true --arg skip-prompt true\`" \
            "- Build: \`nix-build --no-out-link -A $ATTR\` on \`aarch64-darwin\`" \
            "- Package check: \`$VERIFICATION\`" \
            "" \
            "This draft was generated by Tyce Herrman's fork-only Darwin maintainer workflow and requires manual review.")"
          gh pr create \
            --repo NixOS/nixpkgs \
            --base master \
            --head "TyceHerrman:$BRANCH" \
            --title "$TITLE" \
            --body "$body" \
            --draft
      - name: Record the update result
        if: always()
        env:
          ATTR: ${{ matrix.attr }}
          NEW_VERSION: ${{ matrix.new_version }}
          RELEASE_URL: ${{ matrix.release_url }}
          RESULT: ${{ job.status }}
        run: |
          printf '%s\n' \
            "## $ATTR $NEW_VERSION" \
            "" \
            "- Result: $RESULT" \
            "- Release: $RELEASE_URL" >>"$GITHUB_STEP_SUMMARY"
  review-gate:
    name: Start Darwin review for ${{ matrix.attr }} after nixpkgs CI
    needs: [detect, update]
    if: >-
      always() && github.repository == 'TyceHerrman/nixpkgs' && needs.detect.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 185
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Check out the fork-only review gate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: automation
          persist-credentials: false
          sparse-checkout: .github/maintainer-updates
      - name: Wait for nixpkgs CI and dispatch the Darwin review
        env:
          BRANCH: ${{ matrix.branch }}
          GITHUB_TOKEN: ${{ secrets.NIXPKGS_PR_TOKEN }}
          NIXPKGS_REVIEW_GHA_TOKEN: ${{ secrets.NIXPKGS_REVIEW_GHA_TOKEN }}
        run: |
          python3 automation/.github/maintainer-updates/review_gate.py \
            --head "TyceHerrman:$BRANCH" \
            --github-summary "$GITHUB_STEP_SUMMARY"
